# render.yaml — Render manifest for backend + frontend
services:
  - type: web
    name: pharmaguard-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 
    envVars: []

  - type: static_site
    name: pharmaguard-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/dist
    envVars: []
